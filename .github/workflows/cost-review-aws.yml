name: cost-review-aws

# cost-review から呼ばれる。AWS のロールはこのファイル（main）から来たときだけ引き受けられる
on:
  workflow_call:
    # ARN にはアカウント番号が入るので、公開リポジトリのログに出ないよう secrets で受け取る
    secrets:
      AWS_ROLE_ARN:
        required: true
      AGENT_RUNTIME_ARN:
        required: true

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 公開リポジトリでは、この Environment に承認者を付けて承認のフェーズにする
    environment: cost-review
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AGENT_MODES: ${{ vars.AGENT_MODES || 'tool' }}
      # エージェント（Strands のループとツール）は AgentCore Runtime で動く（spec §17）
      AGENT_RUNTIME_ARN: ${{ secrets.AGENT_RUNTIME_ARN }}
      # 要件と閾値はランタイムの zip に同梱（デプロイしたときの main。spec §17.1）
      # sample のテンプレートのリージョン（usageType の接頭辞が変わる）
      TEMPLATE_REGION: ${{ vars.TEMPLATE_REGION || 'us-east-1' }}
      UV_FROZEN: "1"
    steps:
      # 動かすのは main のコードだけ。PR の向かう先のブランチは使わない（改変したブランチに向けた PR を防ぐ）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # ランナーで動かすのは確定値（ledger compare）と AgentCore の呼び出しだけ。Strands は入れない
      - run: uv sync
      # 側ごとに名前で取り、別のディレクトリに置く。head の成果物が base のファイルを
      # 差し替えられないようにする（セキュリティレビューの指摘1）
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-base
          path: templates/base
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-head
          path: templates/head
      - name: 成果物のファイルを確かめる
        run: |
          # 各側にあってよいのは template.json と usage.json だけ。シンボリックリンクも拒否する
          unexpected=$(
            find templates -mindepth 1 -maxdepth 1 ! -name base ! -name head
            find templates -mindepth 2 \( -type l -o -type d -o \( -type f ! -name template.json ! -name usage.json \) \)
          )
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifacts"; exit 1; fi
          test -f templates/base/template.json && test -f templates/head/template.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: 確定値の欄（ledger compare）
        id: compare
        continue-on-error: true
        run: |
          usage=()
          for side in base head; do
            if [ -f "templates/$side/usage.json" ]; then usage+=("--$side-usage" "templates/$side/usage.json"); fi
          done
          uv run ledger compare templates/base/template.json templates/head/template.json \
            --region "$TEMPLATE_REGION" "${usage[@]}" > cost.md
      - name: エージェントの欄
        # PR のタイトルと本文は外から来た文章なので、シェルに埋め込まず環境変数で渡す
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          usage=()
          if [ -f templates/head/usage.json ]; then usage=(--head-usage templates/head/usage.json); fi
          for mode in $AGENT_MODES; do
            uv run python -m pr_agent.remote --runtime-arn "$AGENT_RUNTIME_ARN" \
              --base templates/base/template.json --head templates/head/template.json \
              --pr-title="$PR_TITLE" --pr-body-file pr-body.txt --mode "$mode" --out "agent-$mode.md" \
              --region "$TEMPLATE_REGION" "${usage[@]}" \
              || printf '### Agent notes\n\nThe agent failed to run (mode: %s).\n' "$mode" > "agent-$mode.md"
          done
      - name: PR コメントを投稿（前回のコメントがあれば更新）
        # GitHub への書き込みはこのステップだけ。エージェントには token を渡さない
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            cat cost.md
            for mode in $AGENT_MODES; do echo; cat "agent-$mode.md"; done
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last --create-if-none
      - name: 見積もりの失敗をジョブの失敗にする
        if: steps.compare.outcome == 'failure'
        run: exit 1
